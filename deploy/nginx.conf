server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Igual que el .htaccess: CORS abierto (los JSON de /api/ se consumen desde fuera)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    location = /apk/peruesclave.apk {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="peruesclave.apk"';
        add_header Access-Control-Allow-Origin "*" always;
    }

    # App Flutter: rutas internas caen en su index.html
    location /web/ {
        try_files $uri $uri/ /web/index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|svg|ico|webp|wasm)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
